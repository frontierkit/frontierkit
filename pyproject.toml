[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontierkit"
version = "0.13.0"
description = "Find out which model and prompt answer your questions best: compare models, prompts and pipeline steps on your own questions, on free endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Siddharth Saraswat" }
]

keywords = [
    "llm",
    "evaluation",
    "model-comparison",
    "prompt-comparison",
    "benchmark",
    "rag",
    "llm-agents",
    "pareto-optimization",
    "multi-objective-optimization",
    "architecture-search"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "networkx>=2.8"
]

[project.optional-dependencies]

dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0"
]

viz = [
    "matplotlib>=3.7"
]

real = [
    "openai>=2.48"
]

docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocs<2"
]

[project.urls]
Homepage = "https://frontierkit.github.io/frontierkit/"
Documentation = "https://frontierkit.github.io/frontierkit/"
Repository = "https://github.com/frontierkit/frontierkit"
Issues = "https://github.com/frontierkit/frontierkit/issues"
Changelog = "https://github.com/frontierkit/frontierkit/blob/main/CHANGELOG.md"

[project.scripts]
frontierkit = "frontierkit.cli:main"
frontierkit-registry = "frontierkit.registry.cli:main"

# -----------------------------
# setuptools configuration
# -----------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["frontierkit*"]

[tool.setuptools]
include-package-data = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
