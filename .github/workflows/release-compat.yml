name: Release the chatcortex compatibility package

# chatcortex was renamed to frontierkit. This publishes compat/chatcortex,
# a package with no code of its own that installs frontierkit and keeps the
# old import name working. Run it by hand, once, after the first frontierkit
# release is on PyPI.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          pip install build
          python -m build compat/chatcortex --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-compat
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-compat
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
