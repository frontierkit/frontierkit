site_name: FrontierKit
site_description: Find out which model and prompt answer your questions best, measured on free endpoints.
site_url: https://frontierkit.github.io/frontierkit/
repo_url: https://github.com/frontierkit/frontierkit
repo_name: frontierkit/frontierkit
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Get started: GUIDE.md
  - Use it from Python: USAGE.md
  - How it works: ARCHITECTURE.md
  - Benchmarks: BENCHMARKS.md
  - Changelog: https://github.com/frontierkit/frontierkit/blob/main/CHANGELOG.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  benchmark_results.json
