site_name: ChatCortex
site_description: Find out which model and prompt answer your questions best, measured on free endpoints.
site_url: https://siddharth1012.github.io/chatCortex/
repo_url: https://github.com/siddharth1012/chatCortex
repo_name: siddharth1012/chatCortex
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Get started: GUIDE.md
  - Use it from Python: USAGE.md
  - How it works: ARCHITECTURE.md
  - Benchmarks: BENCHMARKS.md
  - Changelog: https://github.com/siddharth1012/chatCortex/blob/main/CHANGELOG.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  benchmark_results.json
